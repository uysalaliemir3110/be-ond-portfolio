; PHP yükleme sınırları.
;
; Yönetim panelinden yüksek çözünürlüklü orijinaller yüklenirken varsayılan
; sınırlar (çoğu paylaşımlı sunucuda 8M) aşılır. post_max_size aşıldığında PHP
; istek gövdesinin tamamını atar; bu yüzden hata "dosya bulunamadı" gibi görünür.
;
; Bu dosya PHP CGI/FastCGI/FPM altında okunur — cPanel kurulumlarının çoğu böyle
; çalışır. Aynı ayarlar cPanel > MultiPHP INI Editor üzerinden de yapılabilir.
; Değişiklik 5 dakikaya kadar önbellekte kalabilir (user_ini.cache_ttl).

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
